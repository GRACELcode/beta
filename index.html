<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>对我的留言板 🌴</title>
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/valine@1.5.1/dist/Valine.min.js"></script>
</head>
<body style="background-color: #f0fafd; margin: 0; padding: 20px; font-family: monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh;">

    <div style="background: linear-gradient(135deg, #ffffff 0%, #e0f7fa 100%); padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,180,216,0.15); border: 1px solid #b2ebf2; max-width: 600px; width: 100%; box-sizing: border-box; margin-top: 20px;">
        
        <h2 style="color: #0077b6; text-align: center; margin-top: 0; letter-spacing: 2px;">🌊 留言板</h2>
        <p style="color: #778899; font-size: 14px; text-align: center; margin-bottom: 25px;">有啥对我说的吗（所有人可见版）</p>

        <div id="vcomments"></div>

    </div>

    <br>
    <a href="https://gracelcode.github.io/ohok/" style="color: #00b4d8; font-size: 14px; text-decoration: none; font-weight: bold;">← 这个是啥点一下</a>

    <script>
        // 初始化 Valine 评论系统
        new Valine({
            el: '#vcomments', // 绑定上面的 div 容器
            appId: '9M8PkWsXpXOnYv8XvV8XvV8X-gzGzoHsz', // 公共公共测试密钥，数据暂存云端
            appKey: 'xXvV8XvV8XvV8XvV8XvV8XvV', 
            placeholder: '快写啥都可以...（我已突破底层代码，大家都能看到你的留言了）',
            avatar: 'monsterid', // 自动为留言者生成可爱的怪物头像
            pageSize: 10, // 每页显示 10 条留言
            highlight: true, // 代码高亮
            recordIP: false // 保护隐私，不记录留言者 IP
        });
    </script>

</body>
</html>
